<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="브리핑">
<title>아침 브리핑</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#15171a; --sub:#5d6470; --faint:#9aa1ab; --line:#e6e8ec;
  --accent:#2f6fed; --accent-soft:#e8effd; --up:#d9363e; --down:#2f6fed; --warn:#c2410c; --warn-soft:#fdeee4;
  --ok:#15803d; --chip:#eef0f3; --shadow:0 1px 2px rgba(16,24,40,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --seed:#1f9d55;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1113; --card:#1a1d21; --ink:#eceef1; --sub:#a4abb6; --faint:#6b7280; --line:#2a2e34;
  --accent:#6b9bff; --accent-soft:#1d2a44; --up:#ff6b70; --down:#6b9bff; --warn:#fb923c; --warn-soft:#3a2416;
  --ok:#4ade80; --chip:#262a30; --shadow:none;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --seed:#4ade80;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));word-break:keep-all;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.02em}
.icon-btn{border:0;background:var(--card);color:var(--sub);border-radius:10px;width:36px;height:36px;font-size:17px;box-shadow:var(--shadow)}
main{padding:0 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 8px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.card h2 .count{background:var(--chip);border-radius:99px;padding:0 7px;font-size:11px;color:var(--sub)}
.muted{color:var(--sub)} .faint{color:var(--faint);font-size:13px}
ul.lines{list-style:none;margin:0;padding:0}
ul.lines li{position:relative;padding-left:14px;margin:3px 0}
ul.lines li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
ul.lines li.plain{padding-left:0} ul.lines li.plain::before{display:none}
ul.lines li.sub{padding-left:26px;color:var(--sub);font-size:14px} ul.lines li.sub::before{left:14px;background:none;content:"↳";width:auto;height:auto;top:0}
ul.lines li.title{font-weight:700;padding-left:0;margin-top:10px} ul.lines li.title::before{display:none}
b.k{font-weight:700}
.ind{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0;padding-top:0}
.ind .name{font-weight:600} .ind .px{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.ind .chg{grid-column:2;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.ind .chgs{grid-column:1/-1;display:flex;justify-content:flex-end;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.ind .chgs span{background:var(--chip);border-radius:7px;padding:2px 7px;color:var(--sub)}
.ind .chgs b{font-weight:700} .ind .chgs .up b{color:var(--up)} .ind .chgs .down b{color:var(--down)}
.ind .note{grid-column:1/-1;font-size:13px;color:var(--sub)}
.up{color:var(--up)} .down{color:var(--down)}
.hero{padding:4px 2px 10px} .hero .date{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center} .hero .h{font-size:17px;font-weight:700}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.row .meta{font-size:12px;color:var(--faint)}
.chk{appearance:none;width:22px;height:22px;border:2px solid var(--faint);border-radius:7px;margin:2px 0 0;flex:none;display:grid;place-content:center}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .body{color:var(--faint);text-decoration:line-through}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;background:var(--chip);color:var(--sub);vertical-align:1px}
.badge.today{background:var(--accent);color:#fff} .badge.soon{background:var(--accent-soft);color:var(--accent)}
.badge.late{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--chip);color:var(--sub)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.pin{background:var(--warn-soft);color:var(--warn)}
.tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tbtn{border:0;background:var(--chip);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:13px}
.tbtn.on{background:var(--warn-soft);color:var(--warn)}
.tbtn.danger{color:var(--up)}
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:10px 16px;font-size:15px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.form-row{display:flex;gap:8px;margin-top:8px} .form-row>*{flex:1}
.thread{margin-top:10px;border-left:3px solid var(--line);padding-left:10px}
.cmt{margin:6px 0;font-size:14px} .cmt .who{font-size:11px;font-weight:700;color:var(--faint);margin-right:4px}
.cmt.claude .who{color:var(--accent)}
.memo-text{white-space:pre-wrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--faint);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
nav button .i{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--accent);font-weight:700} nav button.on .i{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:11;width:54px;height:54px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(47,111,237,.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:17px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cats button{border:1px solid var(--line);background:none;color:var(--sub);border-radius:99px;padding:4px 11px;font-size:13px}
.cats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--sub);border-radius:8px;padding:6px;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);
  border-radius:99px;padding:7px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--faint);padding:24px 0}
.wl-item{border-top:1px solid var(--line);padding:10px 0} .wl-item:first-of-type{border-top:0}
.wl-item .form-row{margin-top:6px}
a{color:var(--accent)}
.hidden{display:none!important}
.chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:9;background:var(--card);border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:flex-end;padding:8px 12px}
.chatbar textarea{min-height:40px;max-height:140px;border-radius:20px;padding:9px 14px;resize:none;line-height:1.4}
.chatbar button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px;font-weight:700}
body.chat{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.bubble-row{display:flex;flex-direction:column;align-items:flex-end;margin:0 0 12px}
.bubble{background:var(--accent);color:#fff;border-radius:18px 18px 4px 18px;padding:9px 14px;max-width:85%;white-space:pre-wrap}
.bubble a{color:#fff;text-decoration:underline}
.bmeta{font-size:11px;color:var(--faint);margin-top:3px}
.linkbtn{border:0;background:none;color:var(--up);font-size:11px;padding:0 0 0 6px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--accent)} .sw input:checked+span::after{transform:translateX(18px)}
.btn:disabled{opacity:.45} select{appearance:auto}
.card.unseen{box-shadow:0 0 0 2px var(--accent)}
.card.is-seen .memo-text{color:var(--sub)}
.chip.unseen{background:var(--accent);color:#fff;font-weight:700}
.tbtn.seen{background:var(--accent);color:#fff;font-weight:700}
.tbtn.seen-on{background:var(--chip);color:var(--ok)}
.tbtn:disabled{opacity:.4}
.cmt{display:flex;gap:6px;align-items:flex-start} .cmt .ct{flex:1;min-width:0}
.cmt .x{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:0 4px}
.grp{font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 6px}
.grp.cat{color:var(--accent);font-size:12px;margin:4px 2px 6px}
.grp.cat.none{color:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px}
.bar .sp{flex:1}
nav button{position:relative}
nav .nb{position:absolute;top:0;left:50%;margin-left:6px;background:var(--up);color:#fff;border-radius:99px;font-size:10px;line-height:16px;padding:0 5px;font-weight:700}
.cal-head{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.cal-head select{width:auto;padding:6px 8px;font-size:15px}
.cal-head .sp{flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-grid .dow{text-align:center;font-size:11px;color:var(--faint)}
.cal-grid .dow:first-child{color:var(--up)}
.cell{border:0;background:none;border-radius:9px;min-height:46px;padding:4px 0 2px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.cell.other{opacity:.35} .cell.sun{color:var(--up)}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700} .cell.sel{background:var(--accent-soft)}
.cell .dots{display:flex;gap:3px;height:14px;align-items:center}
.cell .n{font-size:10px;line-height:1;background:var(--accent);color:#fff;border-radius:99px;padding:2px 5px}
.cell .m{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.composer{display:none}
#memo-in{min-height:84px}
.ihead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ititle{font-weight:700;font-size:16px;margin:0 0 4px}
.domsel{width:auto;font-size:12px;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:0;font-weight:700}
.chip.sec{background:var(--chip);color:var(--sub)}
.chip.dom{background:var(--accent-soft);color:var(--accent);font-weight:700}
.datehead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
.datehead b{font-size:15px} .datehead .faint{font-size:12px}
.daily summary{cursor:pointer;font-weight:700;color:var(--sub);font-size:13px;list-style:none}
.daily summary::-webkit-details-marker{display:none}
.daily[open] summary{margin-bottom:8px}
.domgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.domcard{border:0;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.domcard .nm{font-weight:700;font-size:16px}
.domcard .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:4px}
.spark i{flex:1;background:var(--accent);opacity:.75;border-radius:2px;min-height:2px}
.spark i.z{background:var(--line);opacity:1}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl .card{position:relative}
.tl .card::before{content:"";position:absolute;left:-19px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl .card.mine::before{background:var(--warn)}
.month{font-size:13px;font-weight:700;color:var(--sub);margin:16px 0 8px}
.clampbox{position:relative;max-height:300px;overflow:hidden}
.clampbox.open{max-height:none}
.sechead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:16px;font-weight:800;margin:18px 2px 8px}
.sechead .faint{font-size:12px;font-weight:400}
.sechead .count{background:var(--chip);border-radius:99px;padding:0 8px;font-size:12px;color:var(--sub)}
.checklist summary{cursor:pointer;font-weight:700;color:var(--sub);font-size:13px;list-style:none}
.checklist summary::-webkit-details-marker{display:none}
.checklist[open] summary{margin-bottom:6px}
.checklist .grp2{font-size:12px;font-weight:700;color:var(--faint);margin:10px 0 2px}
.checklist .grp2.late{color:var(--up)}
.checklist .row{padding:7px 0}
.checklist .mv{display:flex;gap:2px} .checklist .mv .tbtn{padding:4px 7px}
.seedcard summary{cursor:pointer;font-weight:700;color:var(--sub);font-size:13px;list-style:none}
.seedcard summary::-webkit-details-marker{display:none}
.seedcard[open] summary{margin-bottom:8px}
.sstats{display:flex;gap:8px;margin:4px 0 8px}
.sstats div{flex:1;background:var(--chip);border-radius:10px;padding:6px 8px;text-align:center}
.sstats b{display:block;font-size:18px;color:var(--ink)} .sstats span{font-size:11px;color:var(--faint)}
.segs{display:flex;gap:8px;flex-wrap:wrap} .segs .seg{margin:0;flex:1;min-width:150px} .segs{margin-bottom:8px}
.segs .seg button{padding:6px 4px;font-size:13px}
.schart{position:relative;width:100%;height:210px;touch-action:pan-y}
.schart svg{display:block;width:100%;height:100%}
.schart .grid{stroke:var(--line);stroke-width:1}
.schart .ax{fill:var(--faint);font-size:11px}
.schart .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:2}
.schart .tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.slegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.slegend button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:3px 9px;font-size:12px}
.slegend button i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.slegend button.off{opacity:.4;text-decoration:line-through}
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seedbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.seedbtn.on{border-color:var(--seed);background:color-mix(in srgb,var(--seed) 10%,var(--card))}
.seedbtn .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.seedbtn .pips{font-size:16px;letter-spacing:1px}
.seedbtn .pips .e{opacity:.22;filter:grayscale(1)}
.seedbtn .st{font-size:11px;color:var(--faint)}
.cell .sd{font-size:10px;line-height:1;color:var(--seed);font-weight:700}
.track summary{cursor:pointer;font-weight:700;color:var(--sub);font-size:13px;list-style:none}
.track summary::-webkit-details-marker{display:none}
.track[open] summary{margin-bottom:8px}
.trow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .tx{flex:1;min-width:0;font-size:14px}
.trow .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .tx .meta{font-size:12px;color:var(--faint)}
.tbtn.trk{background:var(--warn-soft);color:var(--warn);font-weight:700}
#chat-track{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;opacity:.55}
#chat-track.on,#memo-track.on{opacity:1;border-color:var(--warn);background:var(--warn-soft)}
.pair{position:relative}
.drag{position:absolute;left:-2px;top:0;bottom:40px;width:16px;cursor:grab;touch-action:none;z-index:3;border-radius:14px 0 0 14px}
.drag:hover{background:rgba(127,127,127,.12)}
.pair.dragging{opacity:.9;transform:scale(1.01);z-index:20}
.pair.dragging .mine-q,.pair.dragging .ans{box-shadow:0 10px 28px rgba(0,0,0,.18)}
.linklist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:6px 0}
.linkrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.linkrow:first-child{border-top:0}
.linkrow input{width:18px;height:18px;margin-top:2px;flex:none}
.linkrow .meta{font-size:12px;color:var(--faint)}
.clampbox.short{max-height:none}
.clampbox.short::after{display:none}
.pair .mine-q:last-child{border-radius:14px}
.clampbox:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--card))}
.morebtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;padding:6px 0 0}
.ebar{display:flex;gap:6px;align-items:center;margin-top:8px}
.ebar .sp{flex:1}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fchips button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:4px 12px;font-size:13px}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.jump{display:flex;gap:6px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
.jump select{width:auto;padding:6px 8px;font-size:15px}
.monthnav .side{color:var(--sub);font-size:14px;min-width:64px}
.pinhead{font-size:13px;font-weight:700;color:var(--warn);margin:4px 2px 8px}
.hid{opacity:.55}
.tabrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tabrow:first-of-type{border-top:0}
.tabrow .nm{flex:1;font-weight:600}

.monthnav{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px}
.monthnav b{font-size:17px;min-width:120px;text-align:center}
.pair{margin:0 0 14px}
.pair .mine-q{background:var(--card);border-radius:14px 14px 0 0;padding:12px 16px;box-shadow:var(--shadow);border-left:4px solid var(--warn)}
.pair .ans{background:var(--card);border-top:1px dashed var(--line);padding:12px 16px 12px 28px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}

/* 노트북 등 넓은 화면: 왼쪽 세로 메뉴 + 넓은 본문. 폰 화면은 그대로 */

  body,body.chat{padding:0 0 24px 92px}

</style>

<body>
<header><h1 id="title">브리핑</h1><button class="icon-btn" id="runbrief" aria-label="지금 브리핑" title="지금까지의 메모로 바로 브리핑">⚡</button><button class="icon-btn" id="settings" aria-label="탭 설정">⚙️</button><button class="icon-btn" id="refresh" aria-label="새로고침">↻</button></header>
<main id="view"><div class="empty">불러오는 중…</div></main>

<nav id="nav"></nav>

<div id="chatbar" class="chatbar hidden"><button id="chat-track" title="🎯 추적: 매일 브리핑에서 진행 상황을 챙겨요">🎯</button><textarea id="chat-in" rows="1" placeholder="메모 입력…"></textarea><button id="chat-send" aria-label="보내기">↑</button></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* 연결 정보: 서버 주소는 고정(아래 DEFAULT_API), 인증 키만 이 기기에 저장한다.
   예전 즐겨찾기의 #u=(옛 배포 주소)는 무시한다 — 옛 배포가 정리되면 오류 페이지가 와서 연결이 끊겼기 때문 */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwsuyHhqjNXSUV3cqhV5UGpHW_CPZaMVxw5dhRRvTHFGHKprbdnp5yylkgCxSy3xreqFA/exec';
const STORE_OK = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } })();
const CONN = (() => {
  const h = new URLSearchParams(location.hash.slice(1));
  let key = h.get('k');
  if (key) { try { localStorage.setItem('brief_key', key); localStorage.setItem('brief_api', DEFAULT_API); } catch (e) {} }
  else { try { key = localStorage.getItem('brief_key'); } catch (e) { key = null; } }
  return { url: DEFAULT_API, key };
})();
const KEY = CONN.key;
/* 붙여 넣은 값에서 인증 키를 뽑는다: 키만 / …k=키 / 「인증 키: 키」 문구 통째 */
function parseConn(v){
  v = String(v||'').trim(); if (!v) return null;
  let m = v.match(/[?#&]k=([^&#\s]+)/) || v.match(/인증\s*키\s*[:：]\s*([A-Za-z0-9_-]{16,})/);
  if (m) return { u:DEFAULT_API, k:decodeURIComponent(m[1]) };
  if (!/\s/.test(v) && v.length >= 6) return { u:DEFAULT_API, k:v };   // 인증 키 또는 앱 비밀번호
  return null;
}
function showConnect(msg){
  $('#view').innerHTML = `<section class="card"><h2>${msg?'연결 다시 설정':'처음 연결'}</h2>
    ${msg?`<div class="muted" style="margin-bottom:8px;color:var(--warn)">${esc(msg)}</div>`:''}
    <div class="muted" style="margin-bottom:8px">이 기기에서 처음 여는 거예요. <b>앱 비밀번호</b>를 넣으면 이 기기에 기억돼요.</div>
    <input id="conn-in" type="password" autocomplete="current-password" placeholder="앱 비밀번호">
    ${STORE_OK?'':'<div class="muted" style="margin-top:8px;color:var(--warn)">이 브라우저는 저장이 막혀 있어요. 연결 후 주소창의 주소를 즐겨찾기 해 두세요.</div>'}
    <details style="margin-top:10px"><summary class="faint" style="cursor:pointer">비밀번호를 아직 안 정했거나 잊었다면</summary>
      <ol class="muted" style="margin:6px 0 0;padding-left:20px;line-height:1.7">
        <li><a href="https://docs.google.com/spreadsheets/d/1rBpt0chrirrIrYuaREaA-3Omi9Go5wlayPWRe_ejI98/edit" target="_blank" rel="noopener">구글 시트 「아침 브리핑」</a> 열기</li>
        <li>위쪽 메뉴 <b>브리핑 앱 → 앱 비밀번호 정하기</b> (6자 이상)</li>
        <li>정한 비밀번호를 위 칸에 넣고 [연결]</li></ol>
      <div class="faint" style="margin-top:4px">긴 인증 키(메뉴 「앱 주소·키 다시 보기」)를 넣어도 돼요.</div></details>
    <div class="form-row"><button class="btn" id="conn-save">연결</button></div></section>`;
  $('#conn-in').addEventListener('keydown', e => { if (e.key === 'Enter') $('#conn-save').click(); });
  $('#conn-save').onclick = async () => {
    const c = parseConn($('#conn-in').value);
    if (!c) return toast('비밀번호를 확인해 주세요 (6자 이상)');
    const btn = $('#conn-save'); btn.disabled = true; btn.textContent = '확인 중…';
    try {
      const r = await fetch(DEFAULT_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ key:c.k, action:'ui', fn:'uiSetSeed', args:['2000-01-01','__check',0] }) });
      const t = await r.text(); const d = t.trim().startsWith('{') ? JSON.parse(t) : { ok:false, error:'서버 응답 오류 · 잠시 후 다시' };
      if (!d.ok) { btn.disabled = false; btn.textContent = '연결'; return toast(d.error || '비밀번호가 맞지 않아요'); }
    } catch (e) { btn.disabled = false; btn.textContent = '연결'; return toast('연결 오류 · 잠시 후 다시'); }
    if (STORE_OK) { try { localStorage.setItem('brief_api', c.u); localStorage.setItem('brief_key', c.k); } catch (e) {} location.replace(location.pathname); }
    else { location.replace(location.pathname + '#k=' + encodeURIComponent(c.k)); location.reload(); }
  };
}
const S = { data:null, tab:'today', briefDate:null, open:{}, planSeg:'calendar', memoFilter:'all', memoAll:false,
  histUnseen:false, cal:null, selDay:null, dom:null, domEdit:false, histSeg:'items', month:null,
  folder:'*', folderEdit:false, showHidden:false, expand:{}, tabInit:false };
const TAB_META = { today:['📋','브리핑'], memo:['📝','메모'], plan:['🗓️','일정'], history:['📚','기록'], watch:['📈','지표'], manage:['🎓','공부'] };
const MEMO_LIMIT = 40;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const DOW = ['일','월','화','수','목','금','토'];

async function call(fn, ...args){
  if (fn === 'uiLoad') { try { return await callOnce(fn, args); } catch (e) { await new Promise(r => setTimeout(r, 800)); } }
  try { return await callOnce(fn, args); } catch (e) { toast(e && e.message ? e.message : '연결 오류'); throw e; }
}
async function callOnce(fn, args){
  {
    const r = await fetch(CONN.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: KEY, action: 'ui', fn, args }) });
    const t = await r.text();
    if (!t.trim().startsWith('{')) throw new Error('서버가 JSON 대신 오류 페이지를 보냈어요(잠시 후 ↻ 또는 연결 주소 확인)');
    const d = JSON.parse(t);
    if (!d.ok) throw new Error(d.error || '오류가 났어요');
    return d.data;
  }
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
/* 바로 반영: 화면을 먼저 바꾸고 서버 저장은 뒤에서. 저장이 모두 끝나면 서버 값으로 맞춘다 */
let QP = 0;
const typing = () => { const a=document.activeElement; return a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='checkbox')); };
async function quick(mutate, fn, ...args){
  try { mutate && mutate(); } catch (e) {}
  const y=window.scrollY; render(); window.scrollTo(0,y);
  QP++;
  try { const d = await call(fn, ...args); QP--; if (!QP) { S.data = d; if (!typing() && !$('#sheetBg').classList.contains('show')) { const y2=window.scrollY; render(); window.scrollTo(0,y2); } } }
  catch (e) { QP--; toast('저장 실패 · 다시 불러올게요'); try { S.data = await call('uiLoad'); render(); } catch (_) {} }
}
const nowIso = () => new Date().toISOString();
const findEntry = (type, id) => type==='item' ? (S.data.items||[]).find(i=>i.id===id) : S.data.memos.find(m=>m.id===id);
async function act(fn, ...args){ toast('저장 중…'); const d = await call(fn, ...args); S.data = d; render(); toast('저장됨'); return d; }

function parseDate(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y, m-1, d); }
function md(s){ const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function dday(s){
  const diff = Math.round((parseDate(s) - parseDate(S.data.today)) / 864e5);
  if (diff === 0) return ['D-day','today'];
  if (diff < 0) return [`${-diff}일 지남`,'late'];
  return [`D-${diff}`, diff <= 3 ? 'soon' : ''];
}
function ago(iso){
  if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  const kst = new Date(d.getTime()+9*3600e3);
  return `${kst.getUTCMonth()+1}/${kst.getUTCDate()} ${String(kst.getUTCHours()).padStart(2,'0')}:${String(kst.getUTCMinutes()).padStart(2,'0')}`;
}

function ymd(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

/* ── 확인(봤음) 표시: 확인시각 이후 Claude 댓글(브리핑은 재작성 포함)이 생기면 다시 미확인 ── */
const ts = s => { const t = Date.parse(s); return isNaN(t) ? 0 : t; };
function lastAct(o, type){
  let t = type==='brief' ? ts(o.createdAt) : 0;
  (o.comments||[]).forEach(c => { if (c.by==='claude') t = Math.max(t, ts(c.createdAt)); });
  return t;
}
// 메모: 내가 쓴 것이라 Claude 답글이 새로 달렸을 때만 미확인. 브리핑 항목: [확인]을 눌러야 확인.
function isSeen(o, type){
  if (type==='memo') return lastAct(o, type) <= ts(o.seenAt);
  return !!o.seenAt && lastAct(o, type) <= ts(o.seenAt);
}
function unseenChip(o, type){ return isSeen(o,type) ? '' : `<span class="chip unseen">${o.seenAt?'새 답글':'미확인'}</span>`; }
function seenBtn(type, id, o){
  return isSeen(o,type) ? `<button class="tbtn seen-on" data-seen="${type}|${esc(id)}|0" title="누르면 미확인으로 되돌려요">✓ 확인함</button>`
                        : `<button class="tbtn seen" data-seen="${type}|${esc(id)}|1">확인</button>`;
}
function unseenList(type){
  if (type==='item') return (S.data.items||[]).filter(i=>!isSeen(i,'item'));
  return type==='brief' ? S.data.briefs.filter(b=>!isSeen(b,'brief')) : S.data.memos.filter(m=>!isSeen(m,'memo'));
}
const DAILY = ['sec_indicators','sec_schedule','sec_todo','sec_tracking'];   // 매일 새로 바뀌는 현황 섹션
const domains = () => S.data.domains || ['금융','부동산','인사이트','전공','사업','기타'];
const foldersOf = dom => ((S.data.folders||{})[dom]) || [];
function folderSelect(type, id, dom, cur){
  const fs = foldersOf(dom); if (!fs.length) return '';
  return `<select class="domsel" data-set-folder="${type}|${esc(id)}" aria-label="폴더"><option value="">폴더 없음</option>${fs.map(f=>`<option ${f===cur?'selected':''}>${esc(f)}</option>`).join('')}</select>`;
}
function domSelect(type, id, cur){
  return `<select class="domsel" data-set-dom="${type}|${esc(id)}" aria-label="관리 카테고리">${(cur?[]:['<option value="">분류 안 됨</option>']).concat(domains().map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`)).join('')}</select>`;
}
function seenBar(type){
  const n = unseenList(type).length;
  if (!n) return '';
  return `<div class="card bar"><span class="chip unseen">미확인 ${n}</span><span class="faint sp">확인을 누르면 흐려지고 목록에서 구분돼요</span>
    <button class="tbtn" data-seen-all="${type}">모두 확인</button></div>`;
}
function threadOpen(k, auto){ return S.open[k] !== undefined ? S.open[k] : !!auto; }

/* ── 브리핑 섹션 렌더 ── */
function renderLines(text){
  const out = String(text||'').split('\n').filter(l => l.trim()).map(l => {
    let t = l.trim();
    if (t.startsWith('↳')) return `<li class="sub">${linkify(t.replace(/^↳\s*/,''))}</li>`;
    if (t.startsWith('▸')) return `<li class="title">${linkify(t.replace(/^▸\s*/,''))}</li>`;
    if (t.startsWith('•')) {
      t = t.replace(/^•\s*/,'');
      const m = t.match(/^([^:：]{1,14})[:：]\s*(.*)$/);
      return `<li>${m && !/^https?$/.test(m[1]) ? `<b class="k">${esc(m[1])}:</b> ${linkify(m[2])}` : linkify(t)}</li>`;
    }
    return `<li class="plain">${linkify(t)}</li>`;
  });
  return `<ul class="lines">${out.join('')}</ul>`;
}
function renderIndicators(text){
  const lines = String(text||'').split('\n').filter(l=>l.trim());
  let html = '';
  lines.forEach(l => {
    const t = l.trim();
    if (t.startsWith('↳')) { html += `<div class="ind"><div class="note">↳ ${esc(t.replace(/^↳\s*/,''))}</div></div>`; return; }
    const m = t.match(/^•\s*(.+?)\s+([\d,.\-]+)\s+([▲▼―][\d.]+%)(?:\s+\((?:5일|1주)\s*([+\-]?[\d.]+%)\))?$/);
    if (!m) { html += `<div class="ind"><div class="name">${esc(t.replace(/^•\s*/,''))}</div></div>`; return; }
    const cls = m[3][0]==='▲'?'up':m[3][0]==='▼'?'down':'';
    const w = m[4] ? parseFloat(m[4]) : null, c5 = w==null ? '' : w<0 ? 'down' : w>0 ? 'up' : '';
    const wTxt = w==null ? '-' : (w>0?'▲':w<0?'▼':'―') + Math.abs(w).toFixed(1) + '%';
    html += `<div class="ind"><div class="name">${esc(m[1])}</div><div class="px">${esc(m[2])}</div>
      <div class="chgs"><span class="${cls}">전일 <b>${esc(m[3])}</b></span><span class="${c5}">1주 <b>${esc(wTxt)}</b></span></div></div>`;
  });
  // ↳ 코멘트는 바로 위 지표 아래에 붙도록 note 블록만 이어 붙인다
  return html.replace(/<\/div><div class="ind"><div class="note">/g, '<div class="note">');
}
function commentThread(type, id, comments, open){
  if (!open) return '';
  const k = type+':'+id;
  const list = (comments||[]).map(c => `<div class="cmt ${c.by}"><div class="ct"><span class="who">${c.by==='claude'?'Claude':'나'}</span>${linkify(c.text)} <span class="faint">${ago(c.createdAt)}</span></div>
    <button class="x" data-cdel="${esc(c.id)}" aria-label="댓글 삭제">×</button></div>`).join('');
  return `<div class="thread">${list || '<div class="faint">아직 댓글이 없어요.</div>'}
    <div class="form-row"><input id="cin-${esc(k)}" placeholder="${type==='item'?'답·질문을 적으면 메모 탭으로 옮기고 다음 브리핑에서 답해요':'댓글 (다음 아침 브리핑 때 답해요)'}"><button class="btn" style="flex:none" data-cmt="${esc(k)}">등록</button></div></div>`;
}
function briefCard(b){
  if (!b) return `<div class="card empty">아직 브리핑이 없어요. 내일 아침에 첫 브리핑이 들어옵니다.</div>`;
  const k = 'brief:'+b.date, open = threadOpen(k, false);
  let html = `<div class="hero"><div class="date">${md(b.date)} 브리핑</div><div class="h">${esc(String(b.header||'').replace(/^📋\s*/,''))}</div></div>`;
  S.data.sections.forEach(([f,label]) => {
    const v = b[f]; if (!v || !String(v).trim()) return;
    html += `<section class="card"><h2>${esc(label)}</h2>${f==='sec_indicators'?renderIndicators(v):renderLines(v)}</section>`;
  });
  const nc = (b.comments||[]).length;
  html += `<div class="tools" style="margin:-4px 0 14px">
    <button class="tbtn ${b.pinned?'on':''}" data-pin="brief:${esc(b.date)}">${b.pinned?'📌 고정됨':'📌 고정'}</button>
    <button class="tbtn" data-toggle="${esc(k)}" data-state="${open?1:0}">💬 댓글 ${nc||''}</button></div>
    ${commentThread('brief', b.date, b.comments, open)}`;
  return html;
}

/* ── 탭별 화면 ── */
function itemCard(it, mode){
  const k='item:'+it.id, nc=(it.comments||[]).length, seen=isSeen(it,'item'), open=threadOpen(k, !seen && it.seenAt);
  const body = it.section==='관심 지표' ? renderIndicators(it.body) : renderLines(it.body);
  const btn = mode==='record'
    ? `<button class="tbtn" data-seen="item|${esc(it.id)}|0">브리핑으로 되돌리기</button>`
    : `<button class="tbtn seen" data-seen="item|${esc(it.id)}|1">✓ 확인</button>`;
  return `<section class="card item">
    <div class="ihead">${!seen&&it.seenAt?'<span class="chip unseen">새 답글</span>':''}<span class="chip sec">${esc(it.section||'브리핑')}</span>
      ${it.study?`<span class="chip dom" style="margin-left:auto">🎓 ${esc(it.domain||'')}${it.folder?' › '+esc(it.folder):''}</span>`:''}
      ${it.hasNewComment?'<span class="chip new">답변 대기</span>':''}</div>
    ${it.title?`<div class="ititle">${esc(it.title)}</div>`:''}${body}
    <div class="tools">${btn}<button class="tbtn" data-toggle="${esc(k)}" data-state="${open?1:0}">💬 코멘트 ${nc||''}</button>
      <button class="tbtn ${it.pinned?'trk':''}" data-track="item|${esc(it.id)}|${it.pinned?0:1}">🎯${it.pinned?' 추적 중':' 추적'}</button>
      <button class="tbtn" data-study="item|${esc(it.id)}">🎓 공부로</button>
      <span class="faint" style="margin-left:auto">${memoIdsOf(it).length?`🔗 메모 ${memoIdsOf(it).length}`:''}</span><button class="tbtn" data-emenu="item|${esc(it.id)}">⋯</button></div>

function drawSeedCharts(){

    const label = bar ? (S.seedMode==='month'?'달마다 심은 씨앗 막대 그래프':'주마다 심은 씨앗 막대 그래프') : '누적 씨앗 그래프';
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${g}${paths}<line class="xh" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="var(--faint)" stroke-dasharray="3 3" style="display:none"/><g class="hd"></g></svg><div class="tip"></div>`;

    const show=e=>{ const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width);

      const add = bar ? (view==='area' ? stackTop[i] : null) : (view==='total' ? s.tot[i] : null);

const memoIdsOf = it => String(it.memoIds||'').split(',').map(x=>x.trim()).filter(Boolean);

function domEntries(dom, withHidden){
  const d=S.data, ms = d.memos.filter(m => m.study && m.domain===dom && (withHidden || !m.hidden));
  const linked = new Set(); d.memos.filter(m=>m.study).forEach(m => answersFor(m.id).forEach(i => linked.add(i.id)));
  const its = (d.items||[]).filter(i => i.study && i.domain===dom && !linked.has(i.id) && (withHidden || !i.hidden));
  return ms.map(m => ({kind:'memo', date:m.day, at:m.createdAt, o:m}))
    .concat(its.map(i => ({kind:'item', date:i.date, at:i.createdAt, o:i})))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.at).localeCompare(String(a.at)));
}
function weekBars(entries){
  const today=parseDate(S.data.today), w=new Array(8).fill(0);
  entries.forEach(e => { const k=Math.floor((today-parseDate(e.date))/(7*864e5)); if(k>=0&&k<8) w[7-k]++; });
  const mx=Math.max(1,...w);
  return `<div class="spark" title="최근 8주 (왼쪽이 오래된 주)">${w.map(n=>`<i class="${n?'':'z'}" style="height:${n?Math.max(15,n/mx*100):8}%"></i>`).join('')}</div>`;
}

function answerBlock(it, memoId){

const sortKey = e => { const v=e.o.sort; return (v!=='' && v!=null && !isNaN(+v)) ? +v : -ts(e.at||e.date)/1000; };
function entryCard(e){
  const o=e.o, type=e.kind, key=type+':'+o.id, ex=!!S.expand[key];
  let inner;

    const ans=answersFor(o.id);

const shiftMonth = (ym, n) => { let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
function viewDomain(dom){
  const all=domEntries(dom, S.showHidden), fs=foldersOf(dom);
  if (S.folder!=='*' && S.folder!=='' && !fs.includes(S.folder)) S.folder='*';
  const inFolder = e => S.folder==='*' || (e.o.folder||'')===S.folder;
  const months=[...new Set(domEntries(dom).map(e=>String(e.date).slice(0,7)))].sort().reverse();
  if (!S.month) S.month = months[0] || S.data.today.slice(0,7);      // 기록 있는 가장 최근 달
  const isAll = S.month==='all', base = isAll ? (S.lastMonth || months[0] || S.data.today.slice(0,7)) : S.month;
  if (!isAll) S.lastMonth = S.month;
  const cur=base, [cy,cm]=cur.split('-').map(Number), prev=shiftMonth(cur,-1), next=shiftMonth(cur,1);
  const bySort = (a,b) => sortKey(a)-sortKey(b);
  const pins = all.filter(e => e.o.mpin && inFolder(e)).sort(bySort);
  const es = all.filter(e => !e.o.mpin && inFolder(e) && (isAll || String(e.date).slice(0,7)===cur)).sort(bySort);
  const ty=+S.data.today.slice(0,4); let ys=''; for(let y=ty-3;y<=ty+1;y++) ys+=`<option value="${y}" ${y===cy?'selected':''}>${y}년</option>`;
  let ms=''; for(let m=1;m<=12;m++) ms+=`<option value="${m}" ${m===cm?'selected':''}>${m}월</option>`;
  const hiddenN = domEntries(dom, true).length - domEntries(dom).length;
  let html = `<div class="tools" style="margin:0 0 10px"><button class="tbtn" id="dom-back">‹ 카테고리</button><b style="font-size:18px;margin-left:4px">${esc(dom)}</b>

      <button class="tbtn ${isAll?'on':''}" data-month-all>${isAll?'월별로 보기':'전체'}</button></div>
    <div class="fchips"><button data-folder="*" class="${S.folder==='*'?'on':''}">전체</button>${fs.map(f=>`<button data-folder="${esc(f)}" class="${S.folder===f?'on':''}">📁 ${esc(f)}</button>`).join('')}
      ${fs.length?`<button data-folder="" class="${S.folder===''?'on':''}">폴더 없음</button>`:''}<button id="folder-add">＋ 폴더</button>${fs.length?`<button id="folder-edit">${S.folderEdit?'완료':'폴더 편집'}</button>`:''}</div>`;
  if (S.folderEdit && fs.length) html += `<section class="card">${fs.map(f=>`<div class="tabrow"><span class="nm">📁 ${esc(f)}</span>
      <button class="tbtn" data-folder-ren="${esc(f)}">이름 변경</button><button class="tbtn danger" data-folder-del="${esc(f)}">삭제</button></div>`).join('')}
      <div class="faint" style="margin-top:6px">폴더를 삭제해도 안의 기록은 지워지지 않고 "폴더 없음"으로 옮겨져요.</div></section>`;
  if (pins.length) html += `<div class="pinhead">📌 고정 (${pins.length})</div><div class="elist">${pins.map(entryCard).join('')}</div>`;
  html += es.length ? `<div class="elist">${es.map(entryCard).join('')}</div><div class="faint" style="margin:4px 2px 12px">카드 왼쪽 색 막대를 잡고 끌면 순서를 바꿀 수 있어요</div>`
    : `<div class="empty">${isAll?'기록이 없어요':`${cy}년 ${cm}월 기록이 없어요 · 좌우로 밀거나 ‹ › 로 달을 옮겨 보세요`}</div>`;
  if (hiddenN) html += `<div class="form-row"><button class="btn ghost" id="toggle-hidden">${S.showHidden?'숨긴 항목 감추기':`숨긴 항목 ${hiddenN}건 보기`}</button></div>`;
  return html;
}

  if (ds.study){ const [ty,id]=ds.study.split('|'); entrySheet(ty,id); return; }
  if (ds.emHide){ const [ty,id,v]=ds.emHide.split('|'); closeSheet(); await act('uiSetEntry', ty, id, {hidden: v==='1'}); toast(v==='1'?'숨겼어요 (아래 "숨긴 항목 보기"에서 복구)':'다시 보이게 했어요'); return; }
  if (ds.emDel){ const [ty,id]=ds.emDel.split('|'); if(!confirm('완전히 삭제할까요? 되돌릴 수 없어요.')) return; closeSheet(); await act(ty==='item'?'uiDeleteItem':'uiDeleteMemo', id); return; }
  if (t.id==='settings'){ S.tabDraft=null; tabSheet(); return; }
  if (ds.tabUp!==undefined||ds.tabDown!==undefined){ const o=S.tabDraft.order, i=+(ds.tabUp!==undefined?ds.tabUp:ds.tabDown), j=ds.tabUp!==undefined?i-1:i+1; [o[i],o[j]]=[o[j],o[i]]; tabSheet(); return; }
  if (t.id==='tab-cancel'){ S.tabDraft=null; closeSheet(); return; }
  if (t.id==='tab-save'){ const cfg=S.tabDraft; if(cfg.hidden.length>=cfg.order.length) return toast('탭이 하나는 보여야 해요'); closeSheet(); S.tabDraft=null; S.tabInit=false; await act('uiSaveTabs', cfg); return; }
  if (ds.hseg){ S.histSeg=ds.hseg; render(); return; }
  if (t.id==='memo-send'){ sendChat($('#memo-in')); return; }
  if (ds.seen){ const [ty,id,v]=ds.seen.split('|'); t.disabled=true;
    const o = ty==='brief' ? S.data.briefs.find(b=>b.date===id) : findEntry(ty,id);
    quick(()=>{ if (o) o.seenAt = v==='1' ? nowIso() : ''; }, 'uiSetSeen', ty, [id], v==='1');
    if (ty==='item') toast(v==='1' ? '✓ 확인 → 📝 메모 탭에 저장했어요' : '[브리핑]으로 되돌렸어요'); return; }
  if (ds.seenAll){
    const ty=ds.seenAll, ids=unseenList(ty).map(o=>ty==='brief'?o.date:o.id);
    if (!ids.length || !confirm(`미확인 ${ids.length}건을 모두 확인할까요?`)) return;
    await act('uiSetSeen', ty, ids, true); return;
  }
  if (ds.goto){ S.tab=ds.goto; S.briefDate=null; if (ds.goto==='memo') S.memoFilter='unseen'; window.scrollTo(0,0); render(); return; }
  if (ds.cdel){ if(confirm('댓글을 지울까요?')) await act('uiDeleteComment', ds.cdel); return; }
  if (t.id==='d-add'){ const s={title:$('#d-title').value.trim(),date:S.selDay,time:$('#d-time').value}; if(!s.title) return toast('제목을 적어 주세요'); await act('uiSaveSchedule', s); return; }
  if (ds.cal!==undefined){
    const n=+ds.cal;
    if (n===0){ S.selDay=S.data.today; const p=S.selDay.split('-').map(Number); S.cal={y:p[0],m:p[1]}; }
    else { let {y,m}=S.cal; m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;} S.cal={y,m}; }
    render(); return;
  }
  if (ds.day){ S.selDay=ds.day; const p=ds.day.split('-').map(Number); S.cal={y:p[0],m:p[1]}; render(); return; }
  if (ds.more!==undefined){ S.memoAll=!S.memoAll; render(); return; }
  if (ds.histUnseen!==undefined){ S.histUnseen=!S.histUnseen; render(); return; }
  if (ds.pin){ const [ty,id]=ds.pin.split(/:(.+)/); await act('uiTogglePin', ty, id); return; }
  if (ds.toggle){ S.open[ds.toggle] = ds.state!=='1'; render(); return; }
  if (ds.cmt){ const [ty,id]=ds.cmt.split(/:(.+)/); const inp=t.parentNode.querySelector('input'), v=inp.value; if(!v.trim()) return;
    if (ty==='item'){ const o=findEntry('item',id); const moving = o && !isSeen(o,'item'); const now=nowIso();
      if (o){ o.comments=(o.comments||[]).concat([{id:'tmp',by:'user',text:v,createdAt:now,seen:false}]); o.hasNewComment=true; o.seenAt=now; }
      inp.value=''; const y=window.scrollY; render(); window.scrollTo(0,y); QP++;
      toast(moving ? '💬 댓글 저장 → 📝 메모 탭 「답변 예정」으로 옮겼어요' : '💬 댓글 저장 · 다음 브리핑에서 답해요');
      try { await call('uiAddComment', ty, id, v); const d = await call('uiSetSeen', 'item', [id], true); QP--; if(!QP){ S.data=d; if(!typing()){ const y2=window.scrollY; render(); window.scrollTo(0,y2); } } }
      catch(e){ QP--; toast('저장 실패 · 다시 불러올게요'); try{ S.data=await call('uiLoad'); render(); }catch(_){} }
      return; }
    await act('uiAddComment', ty, id, v); return; }
  if (ds.done){ const [ty,id]=ds.done.split(/:(.+)/), v=t.checked; const o=(ty==='todo'?S.data.todos:S.data.schedules||[]).find(x=>x.id===id);
    quick(()=>{ if(o) o.done=v; }, 'uiSetDone', ty, id, v); toast(v?'✓ 완료':'완료 취소'); return; }
  if (ds.del){ const [ty,id]=ds.del.split(/:(.+)/); if(confirm('삭제할까요?')) await act('uiDelete', ty, id); return; }
  if (ds.editM){ memoSheet(S.data.memos.find(m=>m.id===ds.editM)); return; }
  if (ds.delM){ if(confirm('이 메모와 댓글을 삭제할까요?')) await act('uiDeleteMemo', ds.delM); return; }
  if (ds.editS){ schedSheet(S.data.schedules.find(s=>s.id===ds.editS)); return; }
  if (t.id==='e-save'){ const s={id:ds.id,title:$('#e-title').value.trim(),date:$('#e-date').value,time:$('#e-time').value}; closeSheet(); await act('uiSaveSchedule', s); return; }
  if (t.id==='e-del'){ if(confirm('일정을 삭제할까요?')){ closeSheet(); await act('uiDelete','schedule',ds.id); } return; }
  if (t.id==='s-add'){ const s={title:$('#s-title').value.trim(),date:$('#s-date').value,time:$('#s-time').value}; if(!s.title) return toast('제목을 적어 주세요'); await act('uiSaveSchedule', s); return; }
  if (t.id==='t-add'){ const v=$('#t-text').value; if(!v.trim()) return; await act('uiAddTodo', v); return; }
  if (ds.seg){ S.planSeg=ds.seg; render(); return; }
  if (ds.mf!==undefined){ S.memoFilter=ds.mf; render(); return; }
  if (ds.openB){ S.briefDate=ds.openB; window.scrollTo(0,0); render(); return; }
  if (t.id==='back'){ S.briefDate=null; render(); return; }
  if (t.id==='wl-refresh'){ S.quotesLoaded=false; loadQuotes(); toast('시세 불러오는 중…'); return; }
  if (t.id==='wl-search'){ const q=$('#wl-q').value.trim(); if(!q) return; S.q=q; S.searching=true; render();
    try { S.found = await call('uiSearch', q); } finally { S.searching=false; render(); }
    if (S.found && S.found.length){ const q2 = await call('uiQuotes', S.found.map(f=>f.symbol)).catch(()=>({})); S.quotes=Object.assign(S.quotes||{}, q2); render(); }
    else toast('검색 결과가 없어요'); return; }
  if (ds.add){ const items=wlItems(); if(items.some(x=>x.symbol===ds.add)) return toast('이미 있어요');
    items.push({label:ds.label, symbol:ds.add, prompt:'', enabled:true}); wlChanged(); toast(ds.label+' 추가 (저장을 눌러 주세요)');
    if(!(S.quotes||{})[ds.add]) call('uiQuotes',[ds.add]).then(q=>{S.quotes=Object.assign(S.quotes||{},q); render();}).catch(()=>{}); return; }
  if (ds.wlUp!==undefined||ds.wlDown!==undefined){ const a=wlItems(), i=+(ds.wlUp!==undefined?ds.wlUp:ds.wlDown), j=ds.wlUp!==undefined?i-1:i+1; [a[i],a[j]]=[a[j],a[i]]; S.wlOpen=null; wlChanged(); return; }
  if (ds.wlMore!==undefined){ S.wlOpen = S.wlOpen===+ds.wlMore ? null : +ds.wlMore; render(); return; }
  if (ds.wlClose!==undefined){ S.wlOpen=null; render(); return; }
  if (ds.wlDel!==undefined){ wlItems().splice(+ds.wlDel,1); S.wlOpen=null; wlChanged(); return; }
  if (t.id==='wl-save'){ const p=$('#wl-prompt').value; const d=await act('uiSaveWatchlist', wlItems(), p); S.wl=null; S.wlDirty=false; S.wlPromptDraft=null; render(); return; }
});
document.addEventListener('change', e => {
  const t=e.target, ds=t.dataset;
  if (ds.wlOn!==undefined){ wlItems()[+ds.wlOn].enabled = t.checked; wlChanged(); }
  if (t.id==='wl-cat'){ S.cat=t.value; render(); }
  if (t.id==='em-dom'){ const fs=foldersOf(t.value); $('#em-folder').innerHTML='<option value="">폴더 없음</option>'+fs.map(f=>`<option>${esc(f)}</option>`).join(''); return; }
  if (ds.setDom){ const [ty,id]=ds.setDom.split('|'); act('uiSetDomain', ty, id, t.value); }
  if (ds.setFolder){ const [ty,id]=ds.setFolder.split('|'); act('uiSetEntry', ty, id, {folder:t.value}); }
  if (ds.tabHide){ const h=S.tabDraft.hidden, x=ds.tabHide; if (t.checked){ if(!h.includes(x)) h.push(x); } else S.tabDraft.hidden=h.filter(y=>y!==x); }
  if (t.id==='link-q'){}
  if (t.id==='jump-y' || t.id==='jump-m'){ S.month = `${$('#jump-y').value}-${String($('#jump-m').value).padStart(2,'0')}`; render(); }
  if (t.id==='cal-y' || t.id==='cal-m'){ S.cal={y:+$('#cal-y').value, m:+$('#cal-m').value}; render(); }
});
/* 카드 왼쪽 색 막대를 잡고 끌어 순서 바꾸기 (마우스·터치 공통). 놓으면 앞뒤 카드 사이 값으로 저장 */
let DR=null;
document.addEventListener('pointerdown', e => {
  const h=e.target.closest('.drag'); if(!h) return;
  const pair=h.closest('.pair'); e.preventDefault();
  DR={pair, list:pair.parentNode, moved:false}; pair.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch(_){}
});
document.addEventListener('pointermove', e => {
  if(!DR) return; const y=e.clientY; DR.moved=true;
  const sibs=[...DR.list.children].filter(p=>p.classList.contains('pair') && p!==DR.pair);
  let before=null; for (const p of sibs){ const r=p.getBoundingClientRect(); if (y < r.top + r.height/2){ before=p; break; } }
  if (before !== DR.pair.nextSibling) DR.list.insertBefore(DR.pair, before);
  if (y < 70) window.scrollBy(0,-14); else if (y > innerHeight-90) window.scrollBy(0,14);
});
async function endDrag(){
  if(!DR) return; const {pair,list,moved}=DR; DR=null; pair.classList.remove('dragging'); if(!moved) return;
  const arr=[...list.children].filter(p=>p.classList.contains('pair')), i=arr.indexOf(pair), k=x=>+x.dataset.sk;
  const prev=arr[i-1], next=arr[i+1]; let v;
  if (prev && next) v=(k(prev)+k(next))/2; else if (prev) v=k(prev)+1000; else if (next) v=k(next)-1000; else return;
  if (v===k(pair)) return;
  const [ty,id]=pair.dataset.key.split('|'); await act('uiSetEntry', ty, id, {sort:v}); toast('순서를 바꿨어요');
}
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
let _sx=null, _sy=null;
document.addEventListener('touchstart', e => { const t=e.target; if (t.closest('textarea,input,select,.sheet')) { _sx=null; return; } _sx=e.touches[0].clientX; _sy=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (_sx===null || S.tab!=='manage' || !S.dom) return;
  const dx=e.changedTouches[0].clientX-_sx, dy=e.changedTouches[0].clientY-_sy; _sx=null;
  if (DR || S.month==='all') return;
  if (Math.abs(dx)>70 && Math.abs(dy)<50){ S.month=shiftMonth(S.month, dx<0?1:-1); render(); toast(`${+S.month.slice(5)}월`); }
}, {passive:true});
document.addEventListener('toggle', e => { const c=e.target.classList; if (!c) return;
  if (c.contains('daily')) S.dailyOpen = e.target.open;
  if (c.contains('checklist')) { S.checkOpen = e.target.open; try{ localStorage.setItem('check_open', e.target.open?'1':'0'); }catch(_){} const f=e.target.querySelector('summary .faint'); if(f) f.textContent=`(눌러서 ${e.target.open?'접기':'펴기'})`; }
  if (c.contains('seedcard')) { S.seedOpen = e.target.open; try{ localStorage.setItem('seed_open', e.target.open?'1':'0'); }catch(_){} const f=e.target.querySelector('summary .faint'); if(f) f.textContent=`(눌러서 ${e.target.open?'접기':'펴기'})`; if (e.target.open) drawSeedCharts(); }
  if (c.contains('track')) { S.trackOpen = e.target.open; try{ localStorage.setItem('track_open', e.target.open?'1':'0'); }catch(_){} const f=e.target.querySelector('summary .faint'); if(f) f.textContent=`(눌러서 ${e.target.open?'접기':'펴기'})`; }
}, true);
try { if (localStorage.getItem('track_open')==='0') S.trackOpen=false; if (localStorage.getItem('seed_open')==='0') S.seedOpen=false; if (localStorage.getItem('check_open')==='0') S.checkOpen=false;
  const sm=localStorage.getItem('seed_mode'); if (sm) S.seedMode=sm; const sk=localStorage.getItem('seed_kind'); if (sk) S.seedKind=sk; } catch(_){}
window.addEventListener('resize', () => { clearTimeout(window.__rs); window.__rs=setTimeout(drawSeedCharts, 150); });
document.addEventListener('input', e => {
  const t=e.target, ds=t.dataset;
  if (ds.wlPrompt!==undefined){ wlItems()[+ds.wlPrompt].prompt = t.value; S.wlDirty=true; const b=$('#wl-save'); if(b){b.disabled=false;b.textContent='변경 내용 저장';} }
  if (t.id==='wl-prompt'){ S.wlPromptDraft=t.value; S.wlDirty=true; const b=$('#wl-save'); if(b){b.disabled=false;b.textContent='변경 내용 저장';} }
  if (t.id==='wl-q'){ S.q=t.value; }
  if (t.id==='link-q'){ const q=t.value.trim().toLowerCase(); document.querySelectorAll('.linkrow').forEach(r=>{ r.style.display = !q || r.dataset.txt.includes(q) ? '' : 'none'; }); }
});
async function sendChat(el){
  el = el && el.tagName ? el : $('#chat-in');
  const v=el.value.trim(); if(!v) return;
  el.value=''; el.style.height='';
  const now=new Date().toISOString();
  S.data.memos.unshift({id:'tmp',text:v,status:'new',day:S.data.today,createdAt:now,seenAt:now,comments:[]}); S.memoFilter='all'; render(); window.scrollTo(0,0);
  try {
    S.data = await call('uiAddMemo', v, '');
    if (S.trackNext) { const m=S.data.memos.filter(x=>x.text===v).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
      if (m) S.data = await call('uiSetEntry', 'memo', m.id, {pinned:true}); S.trackNext=false; $('#chat-track').classList.remove('on'); }
    render(); toast('저장됨');
  }
  catch(e){ el.value=v; S.data.memos=S.data.memos.filter(m=>m.id!=='tmp'); render(); }
}
document.getElementById('chat-send').addEventListener('click', () => sendChat($('#chat-in')));
document.addEventListener('keydown', e => { if (e.target.id==='memo-in' && e.key==='Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); sendChat($('#memo-in')); } });
WIDE.addEventListener('change', () => render());
document.getElementById('chat-in').addEventListener('input', e => { e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'; });
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id==='wl-q'){ e.preventDefault(); $('#wl-search').click(); }});
$('#sheetBg').addEventListener('click', e => { if (e.target.id==='sheetBg') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id && e.target.id.startsWith('cin-')) { const b=e.target.parentNode.querySelector('[data-cmt]'); b && b.click(); }});

if (!CONN.url || !CONN.key) {
  showConnect();
} else {
  // 키가 기기에 저장됐으면 주소창에서 지운다(저장이 막힌 브라우저면 주소에 남겨 즐겨찾기로 쓰게 둔다)
  if (location.hash && STORE_OK) history.replaceState(null, '', location.pathname + location.search);
  call('uiLoad').then(d => { S.data=d; render(); }).catch(e => { if (!S.data) showConnect('서버에 연결하지 못했어요 (' + (e && e.message || '오류') + '). ↻로 다시 시도하거나, 키를 다시 넣어 주세요.'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.data)
    call('uiLoad').then(d => { S.data=d; render(); }).catch(()=>{}); });
}
</script>
